<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Goaaal ad</title>
<style>
@font-face{font-family:Lalezar;src:url(../assets/Lalezar.ttf)}
:root{--paper:#8768ad;--bar:#99689d;--dark:#2a1a3d;--ink2:#1d1230;--coral:#ff6b6b;--teal:#4ecdc4;--sun:#ffd93d;--leaf:#3fda7a;--red:#f12345;--cream:#fbf0de}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:Inter,system-ui,sans-serif;color:#fff}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--paper)}
.abs{position:absolute}
.scene{position:absolute;inset:0;overflow:hidden}
.disp{font-family:Lalezar,Inter,sans-serif;letter-spacing:.01em}
.title{font-family:Lalezar;font-size:92px;line-height:1;text-shadow:0 6px 0 var(--dark);color:#fff}
.sub{font-size:34px;font-weight:600;color:rgba(255,255,255,.92);letter-spacing:.01em}
.chip{display:inline-block;font-family:Lalezar;font-size:34px;padding:6px 26px 4px;border-radius:999px;color:var(--dark);box-shadow:0 5px 0 rgba(42,26,61,.7)}
.phone{position:absolute;width:360px;height:740px;border-radius:52px;background:#0c0714;padding:14px;box-shadow:0 30px 60px rgba(20,8,36,.55),inset 0 0 0 4px #3b2c52}
.pscreen{position:relative;width:100%;height:100%;border-radius:40px;background:var(--dark);overflow:hidden}
.notch{position:absolute;left:50%;top:10px;width:110px;height:26px;margin-left:-55px;border-radius:20px;background:#0c0714;z-index:5}
.btn{position:absolute;border-radius:22px;font-family:Lalezar;display:flex;align-items:center;justify-content:center;color:var(--dark);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.panel{position:absolute;border-radius:34px;background:var(--ink2);box-shadow:0 30px 70px rgba(20,8,36,.55),inset 0 0 0 6px #3b2c52;overflow:hidden}
.glow{filter:drop-shadow(0 0 24px rgba(255,217,61,.7))}
.mono{font-family:Inter;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
</style></head><body>
<div id="stage"></div>
<script>
/* ---------- helpers ---------- */
const W=1920,H=1080,FPS=30,DUR=33;
const stage=document.getElementById('stage');
const TICKS=[];
function el(parent,cls,css,html,tag='div'){const e=document.createElement(tag);if(cls)e.className=cls;if(css)e.style.cssText=css;if(html!=null)e.innerHTML=html;(parent||stage).appendChild(e);return e}
function an(e,kf,s,d,ease='cubic-bezier(.2,.8,.2,1)'){return e.animate(kf,{delay:s*1000,duration:Math.max(d,.001)*1000,easing:ease,fill:'both'})}
const BACK='cubic-bezier(.34,1.56,.64,1)';
function pop(e,s,d=.55,from='scale(.55) translateY(40px)'){an(e,[{opacity:0,transform:from},{opacity:1,transform:'none'}],s,d,BACK)}
function slide(e,s,d=.6,from='translateX(-120px)'){an(e,[{opacity:0,transform:from},{opacity:1,transform:'none'}],s,d)}
function fadeIn(e,s,d=.4){an(e,[{opacity:0},{opacity:1}],s,d,'linear')}
function show(e,s,end,d=.2){const T=end-s;an(e,[{opacity:0,offset:0},{opacity:1,offset:d/T},{opacity:1,offset:1-d/T},{opacity:0,offset:1}],s,T,'linear')}
function swap(a,b,t,d=.2){an(a,[{opacity:1},{opacity:0}],t,d,'linear');an(b,[{opacity:0},{opacity:1}],t,d,'linear')}
function press(e,t){an(e,[{transform:'scale(1)',filter:'brightness(1)'},{transform:'scale(.9)',filter:'brightness(1.5)',offset:.35},{transform:'scale(1)',filter:'brightness(1)'}],t,.35,'ease-out')}
function scene(s,e,fi=.35,fo=.35){const d=el(stage,'scene','opacity:0');const T=e-s;an(d,[{opacity:fi?0:1,offset:0},{opacity:1,offset:fi/T},{opacity:1,offset:1-fo/T},{opacity:0,offset:1}],s,T,'linear');return d}
function rng(seed){let x=seed;return()=>{x=(x*1664525+1013904223)%4294967296;return x/4294967296}}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const fmt=s=>{s=Math.max(0,s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0')};

/* ---------- svg icons ---------- */
const ico={
 ball:(sz,c='#fff')=>`<svg width="${sz}" height="${sz}" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="${c}" stroke="#111" stroke-width="5"/><polygon points="50,30 68,43 61,64 39,64 32,43" fill="#111"/><g stroke="#111" stroke-width="4"><line x1="50" y1="30" x2="50" y2="6"/><line x1="68" y1="43" x2="92" y2="36"/><line x1="61" y1="64" x2="76" y2="86"/><line x1="39" y1="64" x2="24" y2="86"/><line x1="32" y1="43" x2="8" y2="36"/></g></svg>`,
 tv:(sz,c)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="14" width="52" height="38" rx="7"/><rect x="13" y="21" width="28" height="24" rx="4" fill="${c}" fill-opacity=".25"/><circle cx="49" cy="28" r="2.5" fill="${c}"/><circle cx="49" cy="38" r="2.5" fill="${c}"/><path d="M20 14 L30 4 M44 14 L34 4"/></svg>`,
 phone:(sz,c)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="17" y="5" width="30" height="54" rx="7"/><path d="M32 22v14M25 29h14"/><circle cx="32" cy="48" r="1.5" fill="${c}"/></svg>`,
 monitor:(sz,c)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="8" width="54" height="36" rx="5"/><path d="M22 56h20M32 44v12"/><path d="M17 33V22M27 33V22" stroke-width="6"/><path d="M36 28h10" stroke-width="5"/></svg>`,
 var:(sz,c)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="16" width="38" height="32" rx="6"/><path d="M43 27l16-9v28l-16-9z"/><circle cx="16" cy="26" r="2.5" fill="${c}"/></svg>`,
 replay:(sz,c)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 30a19 19 0 1 1 6 16"/><path d="M12 14v16h16"/></svg>`,
 check:(sz,c)=>`<svg width="${sz}" height="${sz}" viewBox="0 0 64 64" fill="none" stroke="${c}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 34l14 14 26-30"/></svg>`
};

/* ---------- pitch canvas ---------- */
function mkCanvas(parent,w,h,css){const c=document.createElement('canvas');c.width=w;c.height=h;c.style.cssText=`position:absolute;${css||''}`;parent.appendChild(c);return c}
const PL=[];{const r=rng(7);for(let i=0;i<14;i++)PL.push({bx:.12+.76*r(),by:.18+.64*r(),ax:.05+.05*r(),ay:.05+.05*r(),f:.5+r(),p:r()*6.28,team:i<7?0:1})}
function ballPos(tt){ // loops: midfield -> shot -> goal
 const k=(tt%6)/6;const x=.25+.6*ease(Math.min(1,k*1.3));const y=.5+.18*Math.sin(k*9)*(1-k);return{x,y,k}}
function drawPitch(c,tt,o={}){
 const g=c.getContext('2d'),w=c.width,h=c.height;g.save();
 if(o.flip){g.translate(w,0);g.scale(-1,1)}
 const gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'#2f9a4b');gr.addColorStop(1,'#1f7a3a');g.fillStyle=gr;g.fillRect(0,0,w,h);
 for(let i=0;i<10;i++){g.fillStyle=i%2?'rgba(255,255,255,.05)':'rgba(0,0,0,.05)';g.fillRect(i*w/10,0,w/10,h)}
 g.strokeStyle='rgba(255,255,255,.85)';g.lineWidth=h*.007;
 const m=.05;g.strokeRect(w*m,h*m*1.4,w*(1-2*m),h*(1-2.8*m));
 g.beginPath();g.moveTo(w/2,h*m*1.4);g.lineTo(w/2,h*(1-m*1.4));g.stroke();
 g.beginPath();g.arc(w/2,h/2,h*.14,0,7);g.stroke();
 g.strokeRect(w*m,h*.3,w*.14,h*.4);g.strokeRect(w*(1-m-.14),h*.3,w*.14,h*.4);
 g.strokeRect(w*m,h*.41,w*.05,h*.18);g.strokeRect(w*(1-m-.05),h*.41,w*.05,h*.18);
 const bp=ballPos(tt);
 const ps=PL.map(p=>({x:p.bx+p.ax*Math.sin(tt*p.f+p.p)+(p.team?-.0:.0)+(bp.x-.5)*.25,y:p.by+p.ay*Math.cos(tt*p.f*1.1+p.p),team:p.team}));
 ps.sort((a,b)=>a.y-b.y);
 for(const p of ps){const x=p.x*w,y=p.y*h,s=h*.034;g.fillStyle='rgba(0,0,0,.28)';g.beginPath();g.ellipse(x,y+s*.9,s*.9,s*.35,0,0,7);g.fill();
  g.fillStyle=p.team?'#ffd93d':'#ff6b6b';g.beginPath();g.arc(x,y,s,0,7);g.fill();g.strokeStyle='rgba(0,0,0,.45)';g.lineWidth=2;g.stroke()}
 const bx=bp.x*w,by=bp.y*h,bs=h*.022;g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(bx,by+bs,bs,bs*.4,0,0,7);g.fill();
 g.fillStyle='#fff';g.beginPath();g.arc(bx,by,bs,0,7);g.fill();g.fillStyle='#111';g.beginPath();g.arc(bx,by,bs*.45,0,7);g.fill();
 g.restore();
 // vignette + scan
 const v=g.createRadialGradient(w/2,h/2,h*.3,w/2,h/2,h*.95);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.45)');g.fillStyle=v;g.fillRect(0,0,w,h);
 if(o.scan){g.fillStyle='rgba(0,0,0,.13)';for(let y=0;y<h;y+=4)g.fillRect(0,y,w,2)}
 if(o.tint){g.fillStyle=o.tint;g.fillRect(0,0,w,h)}
}
function drawStatic(c,amt=1){const g=c.getContext('2d'),w=c.width,h=c.height;const id=g.createImageData(w,h);const d=id.data;for(let i=0;i<d.length;i+=4){const v=(Math.random()*255*amt)|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255}g.putImageData(id,0,0)}

 an(st,[{transform:'translateX(0)'},{transform:'translateX(180px)'}],0,40,'linear');

 return b}

{const sc=scene(0,4.5,0,.4);

 const g=el(sc,'abs','left:0;right:0;top:60px;text-align:center;font-family:Lalezar;font-size:250px;line-height:1;color:var(--sun);text-shadow:0 12px 0 #8a3d00,0 0 60px rgba(255,217,61,.7);opacity:0;white-space:nowrap','GOAAAAAAL!');
 an(g,[{opacity:0,transform:'scale(.2) rotate(-8deg)'},{opacity:1,transform:'scale(1.15) rotate(-3deg)',offset:.4},{opacity:1,transform:'scale(1) rotate(-3deg)',offset:.8},{opacity:1,transform:'scale(1.04) rotate(-3deg)'}],2.9,1.4,BACK);
 // confetti
 const r=rng(11);const cols=['#ffd93d','#ff6b6b','#4ecdc4','#3fda7a','#fff'];
 for(let i=0;i<70;i++){const x=r()*1920,c=el(sc,'abs',`left:${x}px;top:-60px;width:${14+r()*14}px;height:${20+r()*20}px;background:${cols[i%5]};border-radius:3px;opacity:0`);
  const dx=(r()-.5)*400,rot=(r()-.5)*1440,s=2.85+r()*.4;an(c,[{opacity:1,transform:`translate(0,0) rotate(0)`},{opacity:1,transform:`translate(${dx}px,1250px) rotate(${rot}px)`}],s,1.6+r(),'cubic-bezier(.3,.2,.6,1)')}

 for(const b of [b1,b2]){an(b,[{opacity:0,transform:'translateY(300px) rotate(0)'},{opacity:1,transform:'translateY(0) rotate(360deg)'}],3.1,.8,BACK)}

}

{const sc=scene(4.2,10.7);bgPurple(sc);
 const tt=el(sc,'abs','left:0;right:0;top:56px;text-align:center',`<div class="title">Phone in hand. <span style="color:var(--sun)">Big screen up front.</span></div>`);slide(tt,4.4,.7,'translateY(-60px)');

 // phone
