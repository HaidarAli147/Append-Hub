<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Go-Wall LAN Controller</title><style>body{font:18px system-ui;background:#7851a9;color:white;margin:0;padding:20px}main{max-width:640px;margin:auto}button,input{font:inherit;padding:13px;margin:5px;border:0;border-radius:7px}button{background:#fff;color:#38234e;cursor:pointer}button:disabled{opacity:.5}input{max-width:180px}section{padding:12px 0;border-top:1px solid #ffffff70}#score{font-size:36px;font-weight:bold}small{display:block}</style><main><h1>Go-Wall · Controller</h1><p>Both devices must be on the same local network. Open the display link shown in the server terminal first.</p><label>Display pairing code <input id="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" placeholder="6 digits"></label><button id="pair">Pair</button><p id="status" role="status">Not connected</p><div id="controls" hidden><section><label>Sport <select id="sport"><option value="football">Football</option><option value="handball">Handball</option><option value="tennis">Tennis</option></select></label><button data-a="toggle">Start / Pause</button><button data-a="undo">Undo</button></section><section><div id="score">0 : 0</div><div id="names"></div><button data-a="plus0">+1 Team 1</button><button data-a="plus1">+1 Team 2</button><button data-a="minus0">−1 Team 1</button><button data-a="minus1">−1 Team 2</button></section><section><button data-a="sound">Sound</button><button data-a="voice">Commentator</button><button data-a="lang">English / العربية</button><button data-a="next">Next handball half</button><button data-a="nudge-">−1 min</button><button data-a="nudge+">+1 min</button></section><small>Only the paired display changes match state. Controller actions do not require cloud access.</small></div></main><script src="controller.js"></script></html>
