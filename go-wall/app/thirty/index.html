<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#8768ad"><title>ثلاثين | Goaaal</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700&family=Edu+VIC+WA+NT+Hand:wght@400..700&family=Lalezar&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css">
<style>
/* Thirty uses the original Goaaal flat purple, white rules, bright tiles and handwritten type. */
body{display:block}main{max-width:1400px;margin:auto;padding:var(--gutter)}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;border-bottom:2px solid var(--ink);padding:12px 0}
h1{font:700 clamp(68px,12vw,140px)/1 var(--sans);margin:28px 0 4px}h2{font:700 clamp(22px,3vw,32px)/1.2 var(--sans);margin:0 0 12px}
p{line-height:1.7;color:var(--ink)}.panel{display:block;border:2px solid var(--ink);max-width:none;padding:20px;margin:18px 0;background:transparent}
.toolbar,.buttons{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
button{background:transparent;color:var(--ink);border:2px solid var(--ink);padding:10px 16px;font-weight:700;cursor:pointer}
button:hover{background:var(--ink);color:var(--paper)}button:disabled{opacity:.35;cursor:not-allowed}button.alt{background:var(--bar)}
input,select{background:var(--ink);color:var(--dark);border:2px solid var(--ink);padding:10px;font:inherit;max-width:210px}input[type=number]{width:85px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:0;border:2px solid var(--ink)}
.player{margin:0;padding:22px;background:var(--sun);color:var(--dark);border-inline-end:2px solid var(--ink);border-bottom:2px solid var(--ink)}
.player:nth-child(4n+2){background:var(--teal)}.player:nth-child(4n+3){background:var(--coral)}.player:nth-child(4n+4){background:var(--leaf)}
.player.out{opacity:.55}.player h2{margin:0}.player p{color:var(--dark)}.player button{color:var(--dark);border-color:var(--dark)}.player button:hover{background:var(--dark);color:var(--ink)}
.player input{background:transparent;color:var(--dark);border:0;border-bottom:2px dashed var(--dark);padding:4px 0;max-width:100%;width:100%;font-weight:700}
.score{font:800 clamp(56px,7vw,92px)/1 var(--sans);margin:14px 0}.muted{color:var(--mute)}.status{font-weight:700}.history{max-height:180px;overflow:auto}
.hide{display:none!important}body.controller #game-controls{display:block}body.controller #players .buttons{display:none}
@media(max-width:500px){.panel{padding:12px}.player{padding:14px}}
</style></head><body><main>
<header><a href="../">← Goaaal</a><div class="toolbar"><button id="language">English</button><button id="fullscreen" class="alt">⛶</button></div></header>
<h1 data-ar="ثلاثين" data-en="Thirty">ثلاثين</h1>
<p data-ar="٤ لاعبين أو أكثر • اللاعب الذي يصل إلى ٣٠ نقطة يخسر • لا يلمس اللاعب الكرة مرتين متتاليتين حتى يلمسها لاعب آخر." data-en="4 or more players • Reach 30 points and you're eliminated • No consecutive touches by the same player.">٤ لاعبين أو أكثر • اللاعب الذي يصل إلى ٣٠ نقطة يخسر • لا يلمس اللاعب الكرة مرتين متتاليتين حتى يلمسها لاعب آخر.</p>
<section class="panel" id="pairing"><h2 data-ar="التحكم من الهاتف" data-en="Phone controller">التحكم من الهاتف</h2><div class="toolbar"><button id="host" data-ar="🖥️ شاشة العرض" data-en="🖥️ Display">🖥️ شاشة العرض</button><button id="join" data-ar="📱 جهاز التحكم" data-en="📱 Controller">📱 جهاز التحكم</button><input id="code" inputmode="numeric" maxlength="8" placeholder="8-digit code" class="hide"><button id="connect" class="hide" data-ar="اتصال" data-en="Connect">اتصال</button></div><p id="connection-status" aria-live="polite"></p></section>
<section class="panel" id="setup"><div class="toolbar"><label><span data-ar="عدد اللاعبين" data-en="Players">عدد اللاعبين</span> <input id="count" type="number" min="4" max="24" value="4"></label><button id="apply" data-ar="تغيير العدد" data-en="Set players">تغيير العدد</button><button id="reset" class="alt" data-ar="مباراة جديدة" data-en="New match">مباراة جديدة</button></div></section>
<section class="panel" id="game-controls"><div class="toolbar"><button id="undo" class="alt" data-ar="↶ تراجع" data-en="↶ Undo">↶ تراجع</button><button id="clear-touch" class="alt" data-ar="إلغاء آخر لمسة" data-en="Clear last touch">إلغاء آخر لمسة</button></div><p id="last-touch"></p><p class="muted" data-ar="هدف عادي +١ | كرة على الطاير +٥ | دبل كيك أو مقصية +٣٠. تُضاف النقاط للاعب المختار." data-en="Normal goal +1 | Volley +5 | Double kick or bicycle kick +30. Points are added to the selected player.">هدف عادي +١ | كرة على الطاير +٥ | دبل كيك أو مقصية +٣٠. تُضاف النقاط للاعب المختار.</p></section>
<div id="players" class="grid"></div>
<section class="panel"><h2 data-ar="سجل اللعب" data-en="Match history">سجل اللعب</h2><div id="history" class="history"></div></section>
</main><script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script><script>
(()=>{'use strict';
const $=id=>document.getElementById(id),storage='gowall.thirty.v1',newPlayer=i=>({id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+i,name:'لاعب '+(i+1),score:0}),initial=()=>({players:Array.from({length:4},(_,i)=>newPlayer(i)),last:null,history:[]});
let game;try{game=JSON.parse(localStorage.getItem(storage))||initial()}catch{game=initial()}
if(!Array.isArray(game.players)||game.players.length<4)game=initial();
let lang='ar',role='local',peer=null,conn=null,undo=[],remoteReady=false;
const labels={touch:['لمسة','Touch'],normal:['هدف عادي +١','Normal goal +1'],volley:['على الطاير +٥','Volley +5'],double:['دبل كيك +٣٠','Double kick +30'],bicycle:['مقصية +٣٠','Bicycle kick +30']};
const tr=(ar,en)=>lang==='ar'?ar:en;
const safe=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
function status(s){$('connection-status').textContent=s}
function save(){if(role==='controller')return;localStorage.setItem(storage,JSON.stringify(game));if(conn?.open&&role==='host')conn.send({type:'state',game})}
function render(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-ar]').forEach(e=>e.textContent=e.dataset[lang]);$('language').textContent=lang==='ar'?'English':'العربية';$('count').value=game.players.length;
$('last-touch').textContent=game.last===null?tr('لم يسجل لمس الكرة بعد','No touch recorded'):tr('آخر من لمس الكرة: ','Last touch: ')+(game.players.find(p=>p.id===game.last)?.name||'');
$('players').innerHTML=game.players.map((p,i)=>{const out=p.score>=30,repeat=game.last===p.id;return '<article class="player '+(out?'out':'')+'"><label>'+tr('اسم اللاعب','Player name')+' <input data-name="'+safe(p.id)+'" maxlength="30" value="'+safe(p.name)+'" '+' '+'></label><div class="score">'+p.score+' / 30</div><p class="status">'+(out?tr('خسر ✕','Eliminated ✕'):repeat?tr('يجب أن يلمسها لاعب آخر أولاً','Another player must touch first'):tr('جاهز','Ready'))+'</p><div class="buttons"><button data-touch="'+safe(p.id)+'" '+(out||repeat?'disabled':'')+'>'+tr('لمس الكرة','Ball touch')+'</button>'+Object.entries(labels).filter(([k])=>k!=='touch').map(([k,v])=>'<button data-award="'+safe(p.id)+'" data-kind="'+k+'" '+(out||game.last!==p.id?'disabled':'')+'>'+v[lang==='ar'?0:1]+'</button>').join('')+'</div></article>'}).join('');
$('history').innerHTML=game.history.slice(0,25).map(h=>'<p>'+safe(h)+'</p>').join('')||tr('لا توجد أحداث','No events');
}
function update(action,d){if(role==='controller'){if(conn?.open)conn.send({type:'command',action,d});return}const p=game.players.find(p=>p.id===d?.id);
if(action==='undo'){if(!undo.length)return;game=undo.pop();save();render();return}
if(action==='reset'){if(!confirm(tr('بدء مباراة جديدة؟','Start a new match?')))return;undo.push(structuredClone(game));game.players.forEach(p=>p.score=0);game.last=null;game.history=[]}
else if(action==='count'){const n=Number(d.n);if(!Number.isInteger(n)||n<4||n>24)return;undo.push(structuredClone(game));while(game.players.length<n)game.players.push(newPlayer(game.players.length));game.players=game.players.slice(0,n);if(!game.players.some(p=>p.id===game.last))game.last=null}
else if(action==='clear'){undo.push(structuredClone(game));game.last=null}
else if(action==='name'){if(!p)return;p.name=String(d.name).slice(0,30)}
else if(action==='touch'){if(!p||p.score>=30||game.last===p.id)return;undo.push(structuredClone(game));game.last=p.id;game.history.unshift(p.name+' · '+tr('لمسة','Touch'))}
else if(action==='award'){const points={normal:1,volley:5,double:30,bicycle:30}[d.kind];if(!p||!points||p.score>=30||game.last!==p.id)return;undo.push(structuredClone(game));p.score+=points;game.history.unshift(p.name+' · +'+points+' ('+labels[d.kind][lang==='ar'?0:1]+')');if(p.score>=30){game.history.unshift(p.name+' · '+tr('خسر','Eliminated'));game.last=null}}
else return;
save();render()}
$('players').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.touch)update('touch',{id:b.dataset.touch});if(b.dataset.award)update('award',{id:b.dataset.award,kind:b.dataset.kind})});
$('players').addEventListener('change',e=>{if(e.target.dataset.name)update('name',{id:e.target.dataset.name,name:e.target.value})});
$('apply').onclick=()=>update('count',{n:$('count').value});$('undo').onclick=()=>update('undo',{});$('reset').onclick=()=>update('reset',{});$('clear-touch').onclick=()=>update('clear',{});$('language').onclick=()=>{lang=lang==='ar'?'en':'ar';render()};$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
function bind(c){conn=c;c.on('open',()=>{remoteReady=true;status(tr('تم الاتصال','Connected'));if(role==='host')c.send({type:'state',game})});c.on('close',()=>{remoteReady=false;status(tr('انقطع الاتصال','Disconnected'))});c.on('data',m=>{if(!m||typeof m!=='object')return;if(role==='host'&&m.type==='command'&&['touch','award','undo','clear','count','name','reset'].includes(m.action))update(m.action,m.d);if(role==='controller'&&m.type==='state'&&m.game&&Array.isArray(m.game.players)){game=m.game;render()}})}
function start(id,ready){if(!window.Peer){status(tr('تعذر تحميل مكتبة الاتصال. يلزم الإنترنت للاقتران.','Pairing library unavailable. Internet is required to pair.'));return}peer=new Peer(id,{config:{iceServers:[{urls:'stun:stun.l.google.com:19302'}]}});peer.on('open',ready);peer.on('error',e=>status('Peer error: '+e.type))}
$('host').onclick=()=>{if(peer)return;role='host';status(tr('جار إنشاء رمز الاقتران...','Creating code...'));const code=String(Math.floor(10000000+Math.random()*90000000));start('gowall-thirty-'+code,()=>{status(tr('رمز الاقتران: ','Pairing code: ')+code);peer.on('connection',bind)})};
$('join').onclick=()=>{if(peer)return;role='controller';document.body.classList.add('controller');$('code').classList.remove('hide');$('connect').classList.remove('hide');status(tr('جار تجهيز الاتصال...','Preparing connection...'));start(undefined,()=>status(tr('أدخل رمز الشاشة واضغط اتصال','Enter the display code and connect')))};
$('connect').onclick=()=>{const code=$('code').value;if(!/^\d{8}$/.test(code))return status(tr('أدخل رمزاً من ٨ أرقام','Enter an 8-digit code'));bind(peer.connect('gowall-thirty-'+code,{reliable:true}));status(tr('جار الاتصال...','Connecting...'))};
render();
})();
</script></body></html>
