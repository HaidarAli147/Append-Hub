<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>براك ستدي - التاريخ</title>
    <style>
        body {
    background-color: #3fda7a;
}
.Home img {
    width: 50px;      
    height: auto;
}
/* Container positioning */
.lang-dropdown {
  position: relative;
  display: inline-block;
}
 
/* Style your main language button */
.lang-btn {
  background-color: #3fda7a;
  color: #fff;
  padding: 10px 15px;
  font-size: 14px;
  cursor: pointer;
  border-radius: 4px;
}
 
/* Hide the menu file list by default */
.lang-menu {
  display: none;
  position: absolute;
  left: 0; /* Aligns menu to the left edge of the button in RTL */
  background-color: #ffffff;
  min-width: 150px;
  box-shadow: 0px 8px 16px rgba(0,0,0,0.15);
  border: 1px solid #ccc;
  border-radius: 4px;
  z-index: 100;
}
 
/* Style the file links inside the menu */
.lang-menu a {
  color: #333;
  padding: 12px 16px;
  text-decoration: none;
  display: block;
  font-family: sans-serif;
  font-size: 14px;
}
 
/* Visual feedback when hovering over a language option */
.lang-menu a:hover {
  background-color: #f1f1f1;
}
 
/* Pure CSS Magic: Show the menu when hovering over the container */
.lang-dropdown:hover .lang-menu {
  display: block;
}
    </style>
</head>

  </div>
</div>
